# Welcome to Jekyll!
#
# This config file is meant for settings that affect your entire site, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# `jekyll serve`. If you change this file, please restart the server process.


# Site Settings
locale                   : "en-US"
title                    : Angus (Sheng-Chun) Chang Portfolio
title_separator          : "-"
subtitle                 : # site tagline that appears below site title in masthead
name                     : Angus (Sheng-Chun) Chang
description              : Angus (Sheng-Chun) Chang - Projects and CV 
baseurl                  : "/fa25-portfolio-ShengChunChang" # Must match your GitHub repo name exactly

# Set to true when you want school/collaborative projects visible again
show_school_projects     : false

# Theme and Style
theme: jekyll-theme-minimal
color_scheme: dark # light/default, dark, or aqua

sass:
  style: compressed

# Outputting
permalink: /:categories/:title/

collections:
  pages:
    output: true
  projects:
    output: true
    permalink: /:collection/:path/
  indprojects:
    output: true
    permalink: /:collection/:path/

# Markdown
markdown: kramdown
kramdown:
  input: GFM

# Plugins (previously gems:)
plugins:
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-seo-tag

# School projects stay in _projects/ but are hidden from the site while
# show_school_projects is false. To show them again, set that flag to true
# and change published below to true.
defaults:
  - scope:
      path: "_projects"
      type: "projects"
    values:
      published: false

